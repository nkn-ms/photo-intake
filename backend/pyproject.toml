[project]
name = "photo-intake-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "mangum",
    "pydantic>=2",
    "boto3",
    "aws-lambda-powertools[tracer]",
]

# 開発のときだけ使うもの（package.json の devDependencies に当たる）。Lambda には載せない。
# uv sync は dev グループを既定で入れる。
[dependency-groups]
dev = [
    "pytest",
    # 偽物にするサービスだけを指定する。moto[all] は全サービス分の依存（Docker 関連など）まで入って重い。
    # rds-data は追加の依存が要らないので、ここに書かなくても使える。
    "moto[s3,dynamodb]",
    "mypy",
    "ruff",
    "httpx",
]

[tool.pytest.ini_options]
# テストから import handler で worker/handler.py を読めるようにする。
# Lambda でも zip の一番上に handler.py が置かれ、import handler として読まれるので、それに合わせている。
pythonpath = ["worker"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100
