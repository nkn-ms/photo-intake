[project]
name = "photo-intake-backend"
version = "0.1.0"
requires-python = ">=3.12"
# Lambda 側に最初からあるもの。zip には入れない。
#   boto3                 … Lambda の Python に最初から入っている
#   aws-lambda-powertools … 公式のレイヤーで載せている（main.tf）
# ローカルで動かす・テストするために、ここに書いて入れておく。
dependencies = [
    "boto3",
    "aws-lambda-powertools",
]

[dependency-groups]
# API の Lambda に一緒に載せるもの（Lambda には入っていない）。make build-api がこれだけを zip に入れる。
api = [
    "fastapi",
    "mangum",
    "pydantic>=2",
]
# 開発のときだけ使うもの（package.json の devDependencies に当たる）。Lambda には載せない。
dev = [
    "pytest",
    # 偽物にするサービスだけを指定する。moto[all] は全サービス分の依存（Docker 関連など）まで入って重い。
    # rds-data は追加の依存が要らないので、ここに書かなくても使える。
    "moto[s3,dynamodb]",
    "mypy",
    "ruff",
    "httpx",
    "types-boto3[bedrock-runtime,rds-data,s3]>=1.43.108",
    "uvicorn>=0.54.0",
]

[tool.uv]
# uv sync で入れるグループ。ローカルでは API のライブラリも使う（動かす・テストする）ので api も入れる
default-groups = ["dev", "api"]

[tool.pytest.ini_options]
# テストから import handler で worker/handler.py を読めるようにする。
# Lambda でも zip の一番上に handler.py が置かれ、import handler として読まれるので、それに合わせている。
pythonpath = ["worker"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
# uv run mypy だけで検査できるように、対象を書いておく。
# tests/ は入れない（偽物の関数や monkeypatch に型を付けても、得られるものが少ない）
files = ["worker", "api"]

[tool.ruff]
line-length = 100
# 自分のコードの置き場所。ここにある auth・db・routers などを「自分のコード」として、
# import の並びで外部ライブラリ（fastapi など）の後ろに分けて置く
src = ["api", "worker"]
